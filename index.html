<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>NOIR — Sign In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: radial-gradient(circle at top, #242424, #090909 65%);
    }
    .login {
      width: 100%;
      max-width: 420px;
      padding: 38px;
      border: 1px solid #343434;
      border-radius: 20px;
      background: rgba(23, 23, 23, .96);
      box-shadow: 0 25px 80px #0008;
    }
    .brand {
      color: #c6a76b;
      font-size: 13px;
      letter-spacing: 5px;
      text-align: center;
    }
    h1 { margin: 20px 0 8px; text-align: center; }
    .sub { margin: 0 0 30px; color: #aaa; font-size: 14px; text-align: center; }
    label { display: block; margin: 18px 0 8px; color: #ddd; font-size: 13px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #414141;
      border-radius: 9px;
      outline: none;
      background: #101010;
      color: white;
      font: inherit;
    }
    input:focus { border-color: #c6a76b; }
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid #c6a76b;
      outline-offset: 3px;
    }
    .password { display: flex; gap: 8px; }
    .password input { flex: 1; min-width: 0; }
    .toggle {
      padding: 0 10px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: transparent;
      color: #c6a76b;
      cursor: pointer;
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      font-size: 12px;
    }
    .remember { display: flex; align-items: center; gap: 7px; margin: 0; color: #bbb; }
    a { color: #c6a76b; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .submit {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #c6a76b;
      color: #111;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .submit:hover { background: #dfc18a; }
    #message { min-height: 36px; margin: 14px 0 0; font-size: 13px; text-align: center; }
    .signup { margin: 22px 0 0; color: #aaa; font-size: 13px; text-align: center; }
    .demo { margin: 24px 0 0; color: #999; font-size: 11px; line-height: 1.6; text-align: center; }
    @media (max-width: 450px) { .login { padding: 26px 20px; } }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand" aria-label="NOIR">N O I R</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your account.</p>

    <form id="loginForm">
      <label for="username">Account ID or username</label>
      <input id="username" name="username" type="text" value="17164" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="password">
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button class="toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#forgot" id="forgot">Forgot password?</a>
      </div>

      <button class="submit" type="submit">Sign In</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="signup">New here? <a href="#signup" id="signup">Create an account</a></p>
    <p class="demo">DEMO ONLY · Credentials are not sent or verified. No real authentication is connected.</p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const visible = password.type === "password";
      password.type = visible ? "text" : "password";
      this.textContent = visible ? "Hide" : "Show";
      this.setAttribute("aria-label", visible ? "Hide password" : "Show password");
      this.setAttribute("aria-pressed", String(visible));
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      message.textContent = "Demo only: your credentials were not sent or verified.";
    });

    document.getElementById("forgot").addEventListener("click", function (event) {
      event.preventDefault();
      message.textContent = "Password reset is not connected in this demo.";
    });

    document.getElementById("signup").addEventListener("click", function (event) {
      event.preventDefault();
      message.textContent = "Account creation is not connected in this demo.";
    });
  </script>
</body>
</html>
